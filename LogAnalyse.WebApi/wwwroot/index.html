<!doctype html>
<html lang="zh-CN">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>日志超时分析</title>
    <!-- 引入 Tailwind CSS (CDN 仅作示例，生产环境建议本地编译) -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- 引入 ECharts 用于图表展示 -->
    <script src="https://cdn.jsdelivr.net/npm/echarts@5.5.0/dist/echarts.min.js"></script>
    <!-- 引入 highlight.js 用于 JSON 高亮 -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/github.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
    <!-- 引入自定义样式 -->
    <link rel="stylesheet" href="/app.css" />
</head>
<body class="bg-slate-50 text-slate-800 font-sans antialiased">
    <!-- 顶部导航栏 -->
    <nav class="bg-white border-b border-slate-200 sticky top-0 z-50">
        <div class="max-w-[1600px] mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between">
            <div class="flex items-center gap-3">
                <svg class="w-8 h-8 text-blue-600" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 19v-6a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2a2 2 0 002-2zm0 0V9a2 2 0 012-2h2a2 2 0 012 2v10m-6 0a2 2 0 002 2h2a2 2 0 002-2m0 0V5a2 2 0 012-2h2a2 2 0 012 2v14a2 2 0 01-2 2h-2a2 2 0 01-2-2z"></path></svg>
                <div>
                    <h1 class="text-xl font-bold text-slate-900 leading-tight">日志超时分析</h1>
                    <p class="text-xs text-slate-500">Log Analysis Dashboard</p>
                </div>
            </div>
            <div class="text-sm text-slate-500 hidden sm:block">
                扫描 Logs 目录，汇总超时接口并查看明细
            </div>
        </div>
    </nav>

    <main class="max-w-[1600px] mx-auto px-4 sm:px-6 lg:px-8 py-8 space-y-6">
        
        <!-- 统计卡片与过滤条件区 -->
        <div class="grid grid-cols-1 lg:grid-cols-4 gap-6">
            
            <!-- 过滤条件侧边栏 -->
            <div class="lg:col-span-1 space-y-6">
                <section class="bg-white rounded-xl shadow-sm border border-slate-200 p-5">
                    <div class="flex items-center gap-2 mb-4 pb-3 border-b border-slate-100">
                        <svg class="w-5 h-5 text-slate-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 4a1 1 0 011-1h16a1 1 0 011 1v2.586a1 1 0 01-.293.707l-6.414 6.414a1 1 0 00-.293.707V17l-4 4v-6.586a1 1 0 00-.293-.707L3.293 7.293A1 1 0 013 6.586V4z"></path></svg>
                        <h2 class="text-base font-semibold text-slate-800">查询条件</h2>
                    </div>
                    
                    <div class="space-y-4">
                        <div>
                            <label class="block text-sm font-medium text-slate-700 mb-1">日志目录</label>
                            <div class="flex items-center gap-2">
                                <input id="logsRootPath" type="text" class="flex-1 h-10 px-3 border border-slate-300 rounded-lg shadow-sm focus:ring-2 focus:ring-blue-500 focus:border-blue-500 sm:text-sm transition-shadow" placeholder="输入绝对路径，或留空使用默认 ../Logs" />
                            </div>
                        </div>
                        <div>
                            <label class="block text-sm font-medium text-slate-700 mb-1">超时阈值 (ms)</label>
                            <div class="relative rounded-md shadow-sm">
                                <input id="thresholdMs" type="number" min="0" step="1" value="5000" class="w-full h-10 pl-3 pr-12 border border-slate-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500 sm:text-sm transition-shadow" />
                                <div class="absolute inset-y-0 right-0 pr-3 flex items-center pointer-events-none">
                                    <span class="text-slate-500 sm:text-sm">ms</span>
                                </div>
                            </div>
                        </div>
                        <div>
                            <label class="block text-sm font-medium text-slate-700 mb-1">开始时间</label>
                            <input id="startTime" type="datetime-local" class="w-full h-10 px-3 border border-slate-300 rounded-lg shadow-sm focus:ring-2 focus:ring-blue-500 focus:border-blue-500 sm:text-sm transition-shadow" />
                        </div>
                        <div>
                            <label class="block text-sm font-medium text-slate-700 mb-1">结束时间</label>
                            <input id="endTime" type="datetime-local" class="w-full h-10 px-3 border border-slate-300 rounded-lg shadow-sm focus:ring-2 focus:ring-blue-500 focus:border-blue-500 sm:text-sm transition-shadow" />
                        </div>
                        
                        <div class="pt-2">
                            <button id="btnQuerySummary" type="button" class="w-full flex justify-center items-center gap-2 py-2.5 px-4 border border-transparent rounded-lg shadow-sm text-sm font-medium text-white bg-blue-600 hover:bg-blue-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-blue-500 transition-colors disabled:opacity-50 disabled:cursor-not-allowed">
                                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path></svg>
                                <span>查询统计</span>
                            </button>
                        </div>
                    </div>
                </section>
            </div>

            <!-- 数据概览图表与汇总列表区 -->
            <div class="lg:col-span-3 space-y-6">
                <!-- 概览卡片组 -->
                <div class="grid grid-cols-1 sm:grid-cols-5 gap-4" id="statsCards">
                    <div class="bg-white rounded-xl shadow-sm border border-slate-200 p-4 flex items-center">
                        <div class="p-3 rounded-full bg-blue-50 text-blue-600 mr-4">
                            <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"></path></svg>
                        </div>
                        <div>
                            <p class="text-sm font-medium text-slate-500 truncate">扫描文件数</p>
                            <p class="text-2xl font-bold text-slate-900" id="statScannedFiles">-</p>
                        </div>
                    </div>
                    <div class="bg-white rounded-xl shadow-sm border border-slate-200 p-4 flex items-center">
                        <div class="p-3 rounded-full bg-indigo-50 text-indigo-600 mr-4">
                            <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 10h16M4 14h16M4 18h16"></path></svg>
                        </div>
                        <div>
                            <p class="text-sm font-medium text-slate-500 truncate">总日志条数</p>
                            <p class="text-2xl font-bold text-slate-900" id="statTotalLogs">-</p>
                        </div>
                    </div>
                    <div class="bg-white rounded-xl shadow-sm border border-slate-200 p-4 flex items-center">
                        <div class="p-3 rounded-full bg-orange-50 text-orange-600 mr-4">
                            <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4m0 4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
                        </div>
                        <div>
                            <p class="text-sm font-medium text-slate-500 truncate">超时条数</p>
                            <p class="text-2xl font-bold text-orange-600" id="statTimeoutLogs">-</p>
                        </div>
                    </div>
                    <div class="bg-white rounded-xl shadow-sm border border-slate-200 p-4 flex items-center">
                        <div class="p-3 rounded-full bg-rose-50 text-rose-600 mr-4">
                            <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z"></path></svg>
                        </div>
                        <div>
                            <p class="text-sm font-medium text-slate-500 truncate">错误条数</p>
                            <p class="text-2xl font-bold text-rose-600" id="statErrorLogs">-</p>
                        </div>
                    </div>
                    <div class="bg-white rounded-xl shadow-sm border border-slate-200 p-4 flex items-center">
                        <div class="p-3 rounded-full bg-amber-50 text-amber-600 mr-4">
                            <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
                        </div>
                        <div>
                            <p class="text-sm font-medium text-slate-500 truncate">最高耗时(ms)</p>
                            <p class="text-2xl font-bold text-amber-600" id="statMaxTime">-</p>
                        </div>
                    </div>
                </div>

                <!-- 图表展示区 -->
                <div class="grid grid-cols-1 lg:grid-cols-2 gap-6 hidden" id="chartSection">
                    <div class="bg-white rounded-xl shadow-sm border border-slate-200 p-5">
                        <h2 class="text-base font-semibold text-slate-800 mb-4 pb-2 border-b border-slate-100">Top 10 超时接口分布</h2>
                        <div id="timeoutChart" style="width: 100%; height: 300px;"></div>
                    </div>
                    <div class="bg-white rounded-xl shadow-sm border border-slate-200 p-5">
                        <h2 class="text-base font-semibold text-slate-800 mb-4 pb-2 border-b border-slate-100">慢接口时间趋势</h2>
                        <div id="timeTrendChart" style="width: 100%; height: 300px;"></div>
                    </div>
                </div>

                <section class="bg-white rounded-xl shadow-sm border border-slate-200 overflow-hidden">
                    <div class="px-5 py-4 border-b border-slate-200 flex justify-between items-center bg-slate-50/50">
                        <div class="flex items-center gap-2">
                            <h2 class="text-base font-semibold text-slate-800">超时接口汇总</h2>
                            <span class="inline-flex items-center px-2.5 py-0.5 rounded-full text-xs font-medium bg-slate-100 text-slate-800" id="summaryBadge">共 0 个接口</span>
                        </div>
                        <div id="summaryStats" class="text-sm text-slate-500 hidden"></div>
                    </div>
                    
                    <!-- 汇总表格骨架屏 (加载中显示) -->
                    <div id="summarySkeleton" class="hidden p-5 space-y-4">
                        <div class="h-4 bg-slate-200 rounded w-full animate-pulse"></div>
                        <div class="h-4 bg-slate-200 rounded w-full animate-pulse"></div>
                        <div class="h-4 bg-slate-200 rounded w-3/4 animate-pulse"></div>
                    </div>

                    <div class="overflow-x-auto max-h-[500px]">
                        <table class="min-w-full divide-y divide-slate-200 text-sm">
                            <thead class="bg-slate-50 sticky top-0 z-10 shadow-sm">
                                <tr>
                                    <th scope="col" class="px-6 py-3 text-left font-medium text-slate-500 uppercase tracking-wider">模块/文件夹</th>
                                    <th scope="col" class="px-6 py-3 text-left font-medium text-slate-500 uppercase tracking-wider">接口 (Method)</th>
                                    <th scope="col" class="px-6 py-3 text-left font-medium text-slate-500 uppercase tracking-wider">
                                        <div class="flex items-center gap-1 cursor-help" title="点击次数可查看明细">
                                            超时次数
                                            <svg class="w-4 h-4 text-slate-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
                                        </div>
                                    </th>
                                    <th scope="col" class="px-6 py-3 text-left font-medium text-slate-500 uppercase tracking-wider">错误次数</th>
                                    <th scope="col" class="px-6 py-3 text-left font-medium text-slate-500 uppercase tracking-wider">平均耗时 (ms)</th>
                                    <th scope="col" class="px-6 py-3 text-left font-medium text-slate-500 uppercase tracking-wider">最大耗时 (ms)</th>
                                    <th scope="col" class="px-6 py-3 text-left font-medium text-slate-500 uppercase tracking-wider">最近调用时间</th>
                                </tr>
                            </thead>
                            <tbody id="summaryBody" class="bg-white divide-y divide-slate-200">
                                <!-- 数据由 JS 渲染 -->
                                <tr>
                                    <td colspan="6" class="px-6 py-8 text-center text-slate-500 bg-slate-50/50">
                                        <div class="flex flex-col items-center justify-center">
                                            <svg class="w-12 h-12 text-slate-300 mb-3" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20 13V6a2 2 0 00-2-2H6a2 2 0 00-2 2v7m16 0v5a2 2 0 01-2 2H6a2 2 0 01-2-2v-5m16 0h-2.586a1 1 0 00-.707.293l-2.414 2.414a1 1 0 01-.707.293h-3.172a1 1 0 01-.707-.293l-2.414-2.414A1 1 0 006.586 13H4"></path></svg>
                                            <p>请调整查询条件并点击"查询统计"按钮获取数据</p>
                                        </div>
                                    </td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                </section>
            </div>
        </div>

        <!-- 详情列表区 -->
        <section id="detailSection" class="bg-white rounded-xl shadow-sm border border-slate-200 overflow-hidden hidden">
            <div class="px-5 py-4 border-b border-slate-200 bg-slate-50/50 flex flex-col sm:flex-row justify-between items-start sm:items-center gap-4">
                <div>
                    <div class="flex items-center gap-2 mb-1">
                        <h2 class="text-base font-semibold text-slate-800">日志明细</h2>
                        <span class="inline-flex items-center px-2 py-0.5 rounded text-xs font-medium bg-blue-100 text-blue-800" id="detailContextBadge"></span>
                    </div>
                    <div id="detailStats" class="text-sm text-slate-500"></div>
                </div>
                
                <!-- 分页控件 -->
                <div class="flex items-center gap-2 bg-white border border-slate-200 rounded-lg p-1 shadow-sm">
                    <button id="btnPrevPage" type="button" class="p-1.5 rounded text-slate-500 hover:text-slate-700 hover:bg-slate-100 disabled:opacity-30 disabled:cursor-not-allowed transition-colors" title="上一页">
                        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"></path></svg>
                    </button>
                    <span id="pageInfo" class="text-sm font-medium text-slate-700 px-2 min-w-[5rem] text-center">第 1 页</span>
                    <button id="btnNextPage" type="button" class="p-1.5 rounded text-slate-500 hover:text-slate-700 hover:bg-slate-100 disabled:opacity-30 disabled:cursor-not-allowed transition-colors" title="下一页">
                        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"></path></svg>
                    </button>
                </div>
            </div>
            
            <div class="overflow-x-auto max-h-[800px]">
                <table class="min-w-full divide-y divide-slate-200 text-sm">
                    <thead class="bg-slate-50 sticky top-0 z-10 shadow-sm">
                        <tr>
                            <th scope="col" class="px-6 py-3 text-left font-medium text-slate-500 uppercase tracking-wider w-40">调用时间</th>
                            <th scope="col" class="px-6 py-3 text-left font-medium text-slate-500 uppercase tracking-wider w-24">耗时(ms)</th>
                            <th scope="col" class="px-6 py-3 text-left font-medium text-slate-500 uppercase tracking-wider w-24">结果码</th>
                            <th scope="col" class="px-6 py-3 text-left font-medium text-slate-500 uppercase tracking-wider w-48">文件路径</th>
                            <th scope="col" class="px-6 py-3 text-left font-medium text-slate-500 uppercase tracking-wider min-w-[300px]">请求参数</th>
                            <th scope="col" class="px-6 py-3 text-left font-medium text-slate-500 uppercase tracking-wider min-w-[300px]">响应参数</th>
                        </tr>
                    </thead>
                    <tbody id="detailBody" class="bg-white divide-y divide-slate-200">
                        <!-- 数据由 JS 渲染 -->
                    </tbody>
                </table>
            </div>
        </section>
        
        <!-- 全局 Toast 提示容器 -->
        <div id="toastContainer" class="fixed bottom-4 right-4 z-50 flex flex-col gap-2"></div>
        
    </main>
    <script src="/app.js"></script>
</body>
</html>
